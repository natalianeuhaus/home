name: Use Milk Route slideshow image 3 as hero

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/convert-milk-route-hero.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Point hero to existing slideshow image 3
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('milk-route/index.html')
          text = path.read_text()
          text = text.replace('src="./Natalia_Neuhaus-9.webp?v=3"', 'src="./landscape/03.webp?v=4"')
          text = text.replace('src="./Natalia_Neuhaus-9.webp"', 'src="./landscape/03.webp?v=4"')
          text = text.replace('src="../Natalia_Neuhaus-9.jpg"', 'src="./landscape/03.webp?v=4"')
          path.write_text(text)
          PY

      - name: Commit hero link
        run: |
          git config user.name "natalianeuhaus"
          git config user.email "natalia@casaneuhaus.com"
          git add milk-route/index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Use Milk Route slideshow image 3 as hero"
          git push