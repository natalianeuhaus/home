<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <style>
    :root { --paper:#f2f0e9; --ink:#121411; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:var(--paper); color:var(--ink); }
    main { width:min(1100px,calc(100% - 28px)); margin:0 auto; padding:24px 0 40px; }
    img { width:100%; height:auto; display:block; filter:invert(1) grayscale(1); mix-blend-mode:multiply; }
    p { margin:14px 0 0; font:10px/1.45 Arial,Helvetica,sans-serif; letter-spacing:.12em; text-transform:uppercase; }
  </style>
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
</head>
<body>
  <main>
    <img src="./linde-disposal-letter-march-29-1944.jpg" alt="Linde Air Products letter to the Manhattan Engineer District dated March 29, 1944." />
    <p>Linde to the Manhattan Engineer District · March 29, 1944</p>
  </main>
</body>
</html>
