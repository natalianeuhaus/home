<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>Greetings from Niagara — Photographs Stage</title>
  <style>
    :root { --niagara-paper:#f1f0ea; --niagara-ink:#151715; }
    * { box-sizing:border-box; }
    html,body { width:100%; min-height:100%; margin:0; }
    body { overflow:hidden; color:var(--niagara-ink); background:var(--niagara-paper); font-family:Georgia,"Times New Roman",serif; }
    button { font:inherit; }
    body.niagara-photo-lightbox-open { overflow:hidden; }
    .niagara-photo-story { --photo-panel-height:100svh; position:relative; min-height:var(--photo-panel-height); color:#f4f0e8; background:var(--niagara-paper); overflow:hidden; }
    .niagara-photo-layout,.niagara-photo-stage { min-height:var(--photo-panel-height); height:var(--photo-panel-height); }
    .niagara-photo-stage { position:relative; min-width:0; background:var(--niagara-paper); }
    .niagara-photo-viewport { position:relative; width:100%; height:100%; overflow:hidden; display:grid; place-items:center; outline:none; cursor:zoom-in; }
    .niagara-photo-viewport::before { content:""; position:absolute; inset:0; pointer-events:none; background:transparent; }
    .niagara-photo-main { position:relative; z-index:1; width:auto !important; height:var(--photo-panel-height) !important; max-width:100% !important; max-height:none !important; object-fit:contain !important; object-position:center center; display:block; opacity:1; transform:scale(1); transition:opacity .24s ease,transform .5s cubic-bezier(.2,.7,.2,1); }
    .niagara-photo-story:not(.is-fullscreen) .niagara-photo-viewport { place-items:center; }
    .niagara-photo-story:not(.is-fullscreen) .niagara-photo-main { width:auto !important; height:auto !important; max-width:calc(100% - 160px) !important; max-height:calc(var(--photo-panel-height) - 76px) !important; align-self:center; }
    .niagara-photo-main.is-changing { opacity:.18; transform:scale(.992); }
    .niagara-photo-control { position:absolute; z-index:5; top:50%; width:52px; height:74px; border:1px solid rgba(255,255,255,.24); color:#fff; background:rgba(8,9,8,.52); backdrop-filter:blur(9px); cursor:pointer; opacity:0; pointer-events:none; transform:translateY(-50%); font:30px/1 Georgia,"Times New Roman",serif; transition:opacity .22s ease,background-color .2s ease,border-color .2s ease; }
    .niagara-photo-control:hover,.niagara-photo-control:focus-visible { background:#30312f; border-color:#30312f; outline:none; }
    .niagara-photo-prev { left:22px; }
    .niagara-photo-next { right:22px; }
    .niagara-photo-story:not(.is-fullscreen) .niagara-photo-control { top:50%; width:66px; height:36px; border:0; color:rgba(21,23,21,.58); background:transparent; backdrop-filter:none; font-size:0; }
    .niagara-photo-story:not(.is-fullscreen) .niagara-photo-control::before { content:""; position:absolute; top:50%; width:42px; height:1px; background:currentColor; }
    .niagara-photo-story:not(.is-fullscreen) .niagara-photo-control::after { content:""; position:absolute; top:50%; width:7px; height:7px; border-top:1px solid currentColor; border-right:1px solid currentColor; }
    .niagara-photo-story:not(.is-fullscreen) .niagara-photo-prev { left:18px; }
    .niagara-photo-story:not(.is-fullscreen) .niagara-photo-prev::before { right:6px; }
    .niagara-photo-story:not(.is-fullscreen) .niagara-photo-prev::after { left:10px; transform:translateY(-50%) rotate(-135deg); }
    .niagara-photo-story:not(.is-fullscreen) .niagara-photo-next { right:18px; }
    .niagara-photo-story:not(.is-fullscreen) .niagara-photo-next::before { left:6px; }
    .niagara-photo-story:not(.is-fullscreen) .niagara-photo-next::after { right:10px; transform:translateY(-50%) rotate(45deg); }
    .niagara-photo-story:not(.is-fullscreen) .niagara-photo-control:hover,
    .niagara-photo-story:not(.is-fullscreen) .niagara-photo-control:focus-visible { color:rgba(21,23,21,.95); background:transparent; border-color:transparent; }
    .niagara-photo-caption-toggle,.niagara-photo-caption-close { border:1px solid rgba(255,255,255,.26); color:#fff; background:rgba(8,9,8,.58); backdrop-filter:blur(9px); cursor:pointer; text-transform:uppercase; letter-spacing:.16em; font:10px/1 Arial,Helvetica,sans-serif; }
    .niagara-photo-caption-toggle { position:absolute; z-index:5; right:6px; top:22px; padding:11px 12px 10px; opacity:0; pointer-events:none; font-size:9px; transition:opacity .22s ease,background-color .2s ease,border-color .2s ease; }
    .niagara-photo-caption-toggle:hover,.niagara-photo-caption-toggle:focus-visible,.niagara-photo-caption-close:hover,.niagara-photo-caption-close:focus-visible { background:#30312f; border-color:#30312f; outline:none; }
    .niagara-photo-index { position:absolute; z-index:5; left:8px; top:22px; padding:10px 11px 9px; color:rgba(255,255,255,.82); background:rgba(8,9,8,.58); backdrop-filter:blur(9px); opacity:0; pointer-events:none; letter-spacing:.17em; font:9px/1 Arial,Helvetica,sans-serif; transition:opacity .22s ease; }
    .niagara-photo-strip { position:absolute; z-index:5; left:50%; bottom:18px; width:min(980px,calc(100% - 180px)); box-sizing:border-box; display:flex; align-items:center; gap:9px; overflow-x:auto; overflow-y:hidden; padding:10px; border:1px solid rgba(255,255,255,.18); background:rgba(5,6,5,.74); backdrop-filter:blur(12px); opacity:0; pointer-events:none; transform:translate(-50%,calc(100% + 32px)); transition:opacity .22s ease,transform .3s cubic-bezier(.2,.7,.2,1); scrollbar-width:none; }
    .niagara-photo-strip::-webkit-scrollbar { display:none; }
    .niagara-photo-thumb { position:relative; flex:0 0 88px; height:54px; padding:0; overflow:hidden; border:1px solid transparent; color:#fff; background:#1a1b19; cursor:pointer; opacity:.46; transition:opacity .2s ease,border-color .2s ease,transform .2s ease; }
    .niagara-photo-thumb:hover,.niagara-photo-thumb:focus-visible { opacity:.82; outline:none; }
    .niagara-photo-thumb.is-active { opacity:1; border-color:#f4f0e8; transform:translateY(-2px); }
    .niagara-photo-thumb img { width:100%; height:100%; object-fit:contain; display:block; }
    .niagara-photo-thumb span { position:absolute; left:5px; bottom:4px; min-width:20px; padding:3px 4px 2px; color:#fff; background:rgba(8,9,8,.76); letter-spacing:.12em; font:8px/1 Arial,Helvetica,sans-serif; }
    .niagara-photo-story.is-controls-visible .niagara-photo-control,.niagara-photo-story:focus-within .niagara-photo-control,.niagara-photo-story.is-controls-visible .niagara-photo-caption-toggle,.niagara-photo-story:focus-within .niagara-photo-caption-toggle,.niagara-photo-story.is-controls-visible .niagara-photo-index,.niagara-photo-story:focus-within .niagara-photo-index { opacity:1; pointer-events:auto; }
    .niagara-photo-stage:has(.niagara-photo-main:hover) .niagara-photo-strip,.niagara-photo-strip:hover,.niagara-photo-strip:focus-within { opacity:1; pointer-events:auto; transform:translate(-50%,0); }
    .niagara-photo-caption { display:none; box-sizing:border-box; overflow-x:hidden; overflow-y:auto; padding:clamp(58px,6vw,96px) clamp(32px,4vw,66px) 52px; border-left:1px solid rgba(255,255,255,.18); background:#10110f; scrollbar-color:#9b958a #1b1c1a; scrollbar-width:auto; }
    .niagara-photo-caption::-webkit-scrollbar { width:11px; }
    .niagara-photo-caption::-webkit-scrollbar-track { background:#1b1c1a; }
    .niagara-photo-caption::-webkit-scrollbar-thumb { background:#9b958a; border:3px solid #1b1c1a; border-radius:999px; }
    .niagara-photo-caption-close { position:absolute; z-index:8; top:20px; right:20px; width:42px; height:42px; padding:0; font-size:18px; letter-spacing:0; }
    .niagara-photo-caption-meta { display:flex; align-items:center; gap:12px; margin:0 0 24px; color:rgba(244,240,232,.62); letter-spacing:.18em; text-transform:uppercase; font:10px/1.2 Arial,Helvetica,sans-serif; }
    .niagara-photo-progress { position:relative; flex:1 1 auto; height:1px; overflow:hidden; background:rgba(244,240,232,.22); }
    .niagara-photo-progress span { position:absolute; inset:0 auto 0 0; width:3.57%; background:#b3322b; transition:width .35s ease; }
    .niagara-photo-caption h3 { margin:0; color:#f4f0e8; letter-spacing:-.035em; font-size:clamp(31px,2.55vw,48px); font-weight:400; line-height:1.02; }
    .niagara-photo-caption-rule { width:42px; height:2px; margin:28px 0; background:#b3322b; }
    .niagara-photo-caption-copy { margin:0; color:rgba(244,240,232,.78); font:clamp(14px,1.05vw,17px)/1.58 Arial,Helvetica,sans-serif; }
    .niagara-photo-caption-copy[hidden] { display:none; }
    .niagara-photo-instructions { margin:38px 0 0; color:rgba(244,240,232,.42); letter-spacing:.12em; text-transform:uppercase; font:9px/1.5 Arial,Helvetica,sans-serif; }
    .niagara-photo-story.is-fullscreen { --photo-panel-height:100svh; position:fixed; z-index:1200; inset:0; width:100%; min-height:100svh; height:100svh; background:#10110f; }
    .niagara-photo-story.is-fullscreen .niagara-photo-layout { display:grid; grid-template-columns:minmax(0,1fr) clamp(380px,32vw,610px); width:100%; min-height:100svh; height:100svh; }
    .niagara-photo-story.is-fullscreen .niagara-photo-stage { min-height:100svh; height:100svh; background:#10110f; }
    .niagara-photo-story.is-fullscreen .niagara-photo-viewport { cursor:default; background:#10110f; }
    .niagara-photo-story.is-fullscreen .niagara-photo-main { height:auto !important; max-width:calc(100% - 64px) !important; max-height:calc(100svh - 112px) !important; }
    .niagara-photo-story.is-fullscreen .niagara-photo-control { top:var(--photo-control-top,calc(100% - 48px)); width:44px; height:40px; border:0; color:rgba(241,239,231,.36); background:transparent; backdrop-filter:none; opacity:1; pointer-events:auto; transform:none; font-size:22px; transition:color .25s ease,opacity .25s ease,transform .25s ease; }
    .niagara-photo-story.is-fullscreen .niagara-photo-control:hover,
    .niagara-photo-story.is-fullscreen .niagara-photo-control:focus-visible { color:#f1efe7; background:transparent; border-color:transparent; opacity:1; }
    .niagara-photo-story.is-fullscreen .niagara-photo-prev { left:var(--photo-prev-left,28px); right:auto; }
    .niagara-photo-story.is-fullscreen .niagara-photo-next { left:var(--photo-next-left,calc(100% - 72px)); right:auto; }
    .niagara-photo-story.is-fullscreen .niagara-photo-index { opacity:1; pointer-events:none; }
    .niagara-photo-story.is-fullscreen .niagara-photo-caption-toggle { display:none; }
    .niagara-photo-story.is-fullscreen .niagara-photo-caption { position:relative; display:block; min-width:0; height:100svh; }

    .niagara-photo-story:fullscreen,.niagara-photo-story:-webkit-full-screen { --photo-panel-height:100vh; width:100vw; min-height:100vh; height:100vh; background:#10110f; }
    .niagara-photo-story:fullscreen .niagara-photo-layout,.niagara-photo-story:-webkit-full-screen .niagara-photo-layout,.niagara-photo-story:fullscreen .niagara-photo-stage,.niagara-photo-story:-webkit-full-screen .niagara-photo-stage { min-height:100vh; height:100vh; }

    @media (max-width:820px) {
      .niagara-photo-control { width:44px; height:62px; font-size:25px; }
      .niagara-photo-prev { left:12px; }
      .niagara-photo-next { right:12px; }
      .niagara-photo-caption-toggle { right:4px; left:auto; top:12px; }
      .niagara-photo-index { left:4px; right:auto; top:12px; }
      .niagara-photo-strip { bottom:12px; width:calc(100% - 24px); }
      .niagara-photo-story.is-fullscreen .niagara-photo-layout { grid-template-columns:1fr; grid-template-rows:minmax(0,58svh) minmax(0,42svh); }
      .niagara-photo-story.is-fullscreen .niagara-photo-stage { min-height:0; height:58svh; }
      .niagara-photo-story.is-fullscreen .niagara-photo-caption { height:42svh; padding:58px 24px 42px; border-left:0; border-top:1px solid rgba(255,255,255,.18); }
      .niagara-photo-caption h3 { font-size:clamp(29px,8vw,44px); }
      .niagara-photo-caption-copy { font-size:15px; }
      .niagara-photo-story:not(.is-fullscreen) .niagara-photo-main { max-width:calc(100% - 104px) !important; max-height:calc(var(--photo-panel-height) - 60px) !important; }
      .niagara-photo-story:not(.is-fullscreen) .niagara-photo-control { top:50%; width:48px; height:32px; }
      .niagara-photo-story:not(.is-fullscreen) .niagara-photo-control::before { width:30px; }
      .niagara-photo-story:not(.is-fullscreen) .niagara-photo-control::after { width:6px; height:6px; }
      .niagara-photo-story:not(.is-fullscreen) .niagara-photo-prev { left:4px; }
      .niagara-photo-story:not(.is-fullscreen) .niagara-photo-prev::before { right:4px; }
      .niagara-photo-story:not(.is-fullscreen) .niagara-photo-prev::after { left:6px; }
      .niagara-photo-story:not(.is-fullscreen) .niagara-photo-next { right:4px; }
      .niagara-photo-story:not(.is-fullscreen) .niagara-photo-next::before { left:4px; }
      .niagara-photo-story:not(.is-fullscreen) .niagara-photo-next::after { right:6px; }
    }
    @media (prefers-reduced-motion:reduce) {
      .niagara-photo-main,.niagara-photo-strip,.niagara-photo-thumb,.niagara-photo-progress span { transition:none !important; }
    }
    @media (hover:none) {
      .niagara-photo-control,.niagara-photo-caption-toggle,.niagara-photo-index { opacity:1; pointer-events:auto; }
    }
  </style>
</head>
<body>
  <div class="niagara-photo-story" data-photo-story>
    <div class="niagara-photo-layout">
      <div class="niagara-photo-stage">
        <div class="niagara-photo-viewport" data-photo-viewport tabindex="0" role="region" aria-roledescription="carousel" aria-label="Greetings from Niagara photographs">
          <img class="niagara-photo-main" data-photo-main src="https://drive.google.com/thumbnail?id=1UiUedeF9j365cxpT9GrTv2wREb7dhidS&amp;sz=w2400" alt="Rainbow Bridge and waterfalls from the Maid of the Mist" style="width:auto;height:var(--photo-panel-height);max-width:100%;max-height:none;object-fit:contain;object-position:center center;" />
          <button class="niagara-photo-control niagara-photo-prev" type="button" data-photo-prev aria-label="Previous photograph">←</button>
          <button class="niagara-photo-control niagara-photo-next" type="button" data-photo-next aria-label="Next photograph">→</button>
          <button class="niagara-photo-caption-toggle" type="button" data-photo-caption-toggle aria-expanded="false" aria-controls="niagara-photo-caption">Captions</button>
          <span class="niagara-photo-index"><span data-photo-current>01</span> / <span data-photo-total>28</span></span>
        </div>
        <div class="niagara-photo-strip" data-photo-strip aria-label="Choose a photograph"></div>
      </div>
      <aside class="niagara-photo-caption" id="niagara-photo-caption" data-photo-caption-panel aria-live="polite" aria-hidden="true" tabindex="-1">
        <button class="niagara-photo-caption-close" type="button" data-photo-caption-close aria-label="Close full-screen photograph">×</button>
        <div class="niagara-photo-caption-meta">
          <span>Photograph</span>
          <div class="niagara-photo-progress" aria-hidden="true"><span data-photo-progress></span></div>
          <span data-photo-caption-number>01</span>
        </div>
        <h3 data-photo-title>Rainbow Bridge and waterfalls from the Maid of the Mist. October 6th, 2023.</h3>
        <div class="niagara-photo-caption-rule" aria-hidden="true"></div>
        <p class="niagara-photo-caption-copy" data-photo-caption></p>
        <p class="niagara-photo-instructions">Use the arrow keys, scroll, or swipe to move through the photographs.</p>
      </aside>
    </div>
  </div>

  <script src="./photographs/slides.js"></script>
  <script>
    (() => {
      const page = document.body;
      const photoStory = document.querySelector('[data-photo-story]');
      const photographs = Array.isArray(window.NIAGARA_PHOTOGRAPHS) ? window.NIAGARA_PHOTOGRAPHS : [];

      if (photoStory && photographs.length) {
        const photoViewport = photoStory.querySelector('[data-photo-viewport]');
        const photoMain = photoStory.querySelector('[data-photo-main]');
        const photoStrip = photoStory.querySelector('[data-photo-strip]');
        const photoCaptionPanel = photoStory.querySelector('[data-photo-caption-panel]');
        const photoTitle = photoStory.querySelector('[data-photo-title]');
        const photoCaption = photoStory.querySelector('[data-photo-caption]');
        const photoCurrent = photoStory.querySelector('[data-photo-current]');
        const photoTotal = photoStory.querySelector('[data-photo-total]');
        const photoCaptionNumber = photoStory.querySelector('[data-photo-caption-number]');
        const photoProgress = photoStory.querySelector('[data-photo-progress]');
        const photoPrev = photoStory.querySelector('[data-photo-prev]');
        const photoNext = photoStory.querySelector('[data-photo-next]');
        const photoCaptionToggle = photoStory.querySelector('[data-photo-caption-toggle]');
        const photoCaptionClose = photoStory.querySelector('[data-photo-caption-close]');
        const photoThumbs = [];
        let photoIndex = 0;
        let photoRenderToken = 0;
        let photoPointerStart = null;
        let photoSuppressClick = false;
        let photoControlsTimer = 0;
        let photoWheelGestureActive = false;
        let photoWheelGestureTimer = 0;
        let photoReturnScrollY = 0;
        let photoControlFrame = 0;

        function syncFullscreenPhotoControls() {
          window.cancelAnimationFrame(photoControlFrame);
          photoControlFrame = window.requestAnimationFrame(() => {
            if (!photoStory.classList.contains('is-fullscreen')) return;
            const stageRect = photoStory.querySelector('.niagara-photo-stage').getBoundingClientRect();
            const imageRect = photoMain.getBoundingClientRect();
            if (!stageRect.width || !stageRect.height || !imageRect.width || !imageRect.height) return;

            const controlWidth = 44;
            const controlHeight = 40;
            const edgeInset = 8;
            const top = Math.min(
              stageRect.height - controlHeight - edgeInset,
              Math.max(edgeInset, imageRect.bottom - stageRect.top + 8)
            );
            const previousLeft = Math.max(
              edgeInset,
              Math.min(stageRect.width - controlWidth - edgeInset, imageRect.left - stageRect.left)
            );
            const nextLeft = Math.max(
              edgeInset,
              Math.min(stageRect.width - controlWidth - edgeInset, imageRect.right - stageRect.left - controlWidth)
            );

            photoStory.style.setProperty('--photo-control-top', `${top}px`);
            photoStory.style.setProperty('--photo-prev-left', `${previousLeft}px`);
            photoStory.style.setProperty('--photo-next-left', `${nextLeft}px`);
          });
        }

        function revealPhotoControls() {
          photoStory.classList.add('is-controls-visible');
          window.clearTimeout(photoControlsTimer);
          photoControlsTimer = window.setTimeout(() => {
            photoStory.classList.remove('is-controls-visible');
          }, 2200);
        }

        function getBrowserFullscreenElement() {
          return document.fullscreenElement || document.webkitFullscreenElement || null;
        }

        function setPhotoFullscreen(open, moveFocus = false, syncBrowser = true) {
          const wasFullscreen = photoStory.classList.contains('is-fullscreen');
          if (open && !wasFullscreen) photoReturnScrollY = window.scrollY;
          photoStory.classList.toggle('is-fullscreen', open);
          page.classList.toggle('niagara-photo-lightbox-open', open);
          photoCaptionPanel.setAttribute('aria-hidden', open ? 'false' : 'true');
          photoCaptionToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
          photoCaptionPanel.scrollTop = 0;

          if (syncBrowser && open && !getBrowserFullscreenElement()) {
            try {
              const request = photoStory.requestFullscreen
                ? photoStory.requestFullscreen({ navigationUI:'hide' })
                : photoStory.webkitRequestFullscreen
                  ? photoStory.webkitRequestFullscreen()
                  : null;
              if (request && typeof request.catch === 'function') request.catch(() => {});
            } catch (error) {}
          }

          if (syncBrowser && !open && getBrowserFullscreenElement()) {
            try {
              const exit = document.exitFullscreen
                ? document.exitFullscreen()
                : document.webkitExitFullscreen
                  ? document.webkitExitFullscreen()
                  : null;
              if (exit && typeof exit.catch === 'function') exit.catch(() => {});
            } catch (error) {}
          }

          if (open) syncFullscreenPhotoControls();
          if (open && moveFocus) photoCaptionClose.focus({ preventScroll:true });
          if (!open && wasFullscreen) {
            requestAnimationFrame(() => window.scrollTo({ top:photoReturnScrollY, behavior:'auto' }));
          }
        }

        const syncPhotoFullscreenFromBrowser = () => {
          const browserFullscreen = getBrowserFullscreenElement();
          if (!browserFullscreen && photoStory.classList.contains('is-fullscreen')) {
            setPhotoFullscreen(false, false, false);
          } else if (browserFullscreen === photoStory && !photoStory.classList.contains('is-fullscreen')) {
            setPhotoFullscreen(true, false, false);
          }
          if (browserFullscreen === photoStory) syncFullscreenPhotoControls();
        };
        document.addEventListener('fullscreenchange', syncPhotoFullscreenFromBrowser);
        document.addEventListener('webkitfullscreenchange', syncPhotoFullscreenFromBrowser);
        window.addEventListener('resize', syncFullscreenPhotoControls);
        photoMain.addEventListener('load', syncFullscreenPhotoControls);

        photographs.forEach((photo, index) => {
          const thumb = document.createElement('button');
          const image = document.createElement('img');
          const number = document.createElement('span');
          thumb.type = 'button';
          thumb.className = 'niagara-photo-thumb';
          thumb.setAttribute('aria-label', `View photograph ${index + 1}: ${photo.title}`);
          image.src = photo.src;
          image.alt = '';
          image.loading = 'lazy';
          number.textContent = photo.number;
          thumb.append(image, number);
          thumb.addEventListener('click', () => showPhotograph(index));
          photoStrip.appendChild(thumb);
          photoThumbs.push(thumb);
        });

        function centerPhotoThumb(thumb, animate = true) {
          if (!thumb) return;
          const left = thumb.offsetLeft - (photoStrip.clientWidth - thumb.offsetWidth) / 2;
          photoStrip.scrollTo({ left:Math.max(0,left), behavior:animate ? 'smooth' : 'auto' });
        }

        function preloadPhotograph(index) {
          const photo = photographs[(index + photographs.length) % photographs.length];
          if (!photo) return;
          const image = new Image();
          image.src = photo.src;
        }

        function showPhotograph(index, instant = false) {
          photoIndex = (index + photographs.length) % photographs.length;
          const photo = photographs[photoIndex];
          const token = ++photoRenderToken;

          photoTitle.textContent = photo.title;
          photoCaption.textContent = photo.caption;
          photoCaption.hidden = !photo.caption;
          photoCurrent.textContent = photo.number;
          photoTotal.textContent = String(photographs.length).padStart(2, '0');
          photoCaptionNumber.textContent = photo.number;
          photoProgress.style.width = `${((photoIndex + 1) / photographs.length) * 100}%`;
          photoCaptionPanel.scrollTop = 0;

          photoThumbs.forEach((thumb, thumbIndex) => {
            const active = thumbIndex === photoIndex;
            thumb.classList.toggle('is-active', active);
            thumb.setAttribute('aria-current', active ? 'true' : 'false');
            thumb.tabIndex = active ? 0 : -1;
          });
          centerPhotoThumb(photoThumbs[photoIndex], !instant);

          const commitImage = () => {
            if (token !== photoRenderToken) return;
            photoMain.src = photo.src;
            photoMain.alt = photo.title;
            requestAnimationFrame(() => photoMain.classList.remove('is-changing'));
          };

          if (instant || photoMain.getAttribute('src') === photo.src) {
            commitImage();
          } else {
            photoMain.classList.add('is-changing');
            const loader = new Image();
            loader.addEventListener('load', commitImage, { once:true });
            loader.addEventListener('error', commitImage, { once:true });
            loader.src = photo.src;
          }

          preloadPhotograph(photoIndex + 1);
          preloadPhotograph(photoIndex - 1);
          revealPhotoControls();
        }

        photoStory.addEventListener('pointerenter', revealPhotoControls);
        photoStory.addEventListener('pointermove', revealPhotoControls);
        photoStory.addEventListener('focusin', revealPhotoControls);
        photoStory.addEventListener('pointerleave', () => {
          window.clearTimeout(photoControlsTimer);
          photoStory.classList.remove('is-controls-visible');
        });

        const advancePhotograph = direction => showPhotograph(photoIndex + direction);
        photoPrev.addEventListener('click', event => {
          event.stopPropagation();
          advancePhotograph(-1);
        });
        photoNext.addEventListener('click', event => {
          event.stopPropagation();
          advancePhotograph(1);
        });
        photoCaptionToggle.addEventListener('click', event => {
          event.stopPropagation();
          setPhotoFullscreen(true, true);
        });
        photoCaptionClose.addEventListener('click', () => {
          setPhotoFullscreen(false);
          photoViewport.focus({ preventScroll:true });
        });
        photoViewport.addEventListener('click', event => {
          if (event.target.closest('button')) return;
          if (photoSuppressClick) {
            photoSuppressClick = false;
            return;
          }
          if (!photoStory.classList.contains('is-fullscreen')) setPhotoFullscreen(true);
        });
        photoViewport.addEventListener('wheel', event => {
          const movement = Math.abs(event.deltaX) > Math.abs(event.deltaY) ? event.deltaX : event.deltaY;
          if (Math.abs(movement) < 8) return;
          event.preventDefault();
          window.clearTimeout(photoWheelGestureTimer);
          photoWheelGestureTimer = window.setTimeout(() => { photoWheelGestureActive = false; }, 180);
          if (photoWheelGestureActive) return;
          photoWheelGestureActive = true;
          advancePhotograph(movement > 0 ? 1 : -1);
        }, { passive:false });
        photoViewport.addEventListener('keydown', event => {
          if (event.key === 'Escape') {
            setPhotoFullscreen(false);
            return;
          }
          if ((event.key === 'Enter' || event.key === ' ') && !photoStory.classList.contains('is-fullscreen')) {
            event.preventDefault();
            setPhotoFullscreen(true);
            return;
          }
          if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
          event.preventDefault();
          advancePhotograph(event.key === 'ArrowRight' ? 1 : -1);
        });
        photoViewport.addEventListener('pointerdown', event => {
          if (!event.isPrimary) return;
          photoPointerStart = event.clientX;
        });
        photoViewport.addEventListener('pointerup', event => {
          if (photoPointerStart === null || !event.isPrimary) return;
          const distance = event.clientX - photoPointerStart;
          photoPointerStart = null;
          if (Math.abs(distance) > 48) {
            photoSuppressClick = true;
            advancePhotograph(distance < 0 ? 1 : -1);
          }
        });
        photoViewport.addEventListener('pointercancel', () => { photoPointerStart = null; });
        photoCaptionPanel.addEventListener('keydown', event => {
          if (event.key === 'Escape') {
            setPhotoFullscreen(false);
            photoViewport.focus({ preventScroll:true });
            return;
          }
          if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
          event.preventDefault();
          advancePhotograph(event.key === 'ArrowRight' ? 1 : -1);
        });

        setPhotoFullscreen(false);
        showPhotograph(0, true);
      }
    })();
  </script>
</body>
</html>
